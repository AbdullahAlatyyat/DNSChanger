name: Release

on:
  push:
    tags:
      - "v*.*.*"

permissions:
  contents: write

jobs:
  build-and-release:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup MSBuild
        uses: microsoft/setup-msbuild@v2

      - name: Setup NuGet
        uses: NuGet/setup-nuget@v2

      - name: Restore NuGet packages
        run: nuget restore DNSChanger.sln

      - name: Build (Release)
        run: msbuild DNSChanger.sln /p:Configuration=Release /p:Platform="Any CPU" /m

      - name: Package artifact
        id: package
        shell: pwsh
        run: |
          $version = "${{ github.ref_name }}"
          $zipName = "DNSChanger-$version-win.zip"
          Compress-Archive -Path "DNSChanger\bin\Release\*" -DestinationPath $zipName
          echo "zip_name=$zipName" >> $env:GITHUB_OUTPUT

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          name: DNSChanger ${{ github.ref_name }}
          generate_release_notes: true
          files: ${{ steps.package.outputs.zip_name }}
